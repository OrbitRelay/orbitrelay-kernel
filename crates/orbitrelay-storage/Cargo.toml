[package]
name = "orbitrelay-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Append-only event persistence, cursor, checkpoint, and replay contracts for OrbitRelay"

[dependencies]
orbitrelay-core.workspace = true
orbitrelay-protocol.workspace = true
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
