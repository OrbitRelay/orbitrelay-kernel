[package]
name = "orbitrelay-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Protocol codecs, connection coordination, and WebSocket transport for OrbitRelay"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
orbitrelay-core.workspace = true
orbitrelay-protocol.workspace = true
orbitrelay-query.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["rt"] }
