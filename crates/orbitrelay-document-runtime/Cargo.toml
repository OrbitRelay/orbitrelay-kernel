[package]
name = "orbitrelay-document-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Document composition, catalog, read model, and typed Query handlers for OrbitRelay"

[dependencies]
async-trait = "0.1"
orbitrelay-asset.workspace = true
orbitrelay-asset-runtime.workspace = true
orbitrelay-canvas.workspace = true
orbitrelay-canvas-runtime.workspace = true
orbitrelay-document.workspace = true
orbitrelay-protocol.workspace = true
orbitrelay-query.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
