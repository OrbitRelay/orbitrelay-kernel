[package]
name = "orbitrelay-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Event publication and subscription ports and in-memory adapters for OrbitRelay"

[dependencies]
orbitrelay-core.workspace = true
orbitrelay-protocol.workspace = true
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
